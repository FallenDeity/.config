general:
  # Commands to run when the WM has started.
  startup_commands: ['shell-exec zebar']

  # Commands to run just before the WM is shutdown.
  shutdown_commands: []

  # Commands to run after the WM config is reloaded.
  config_reload_commands: []

  # Whether to automatically focus windows underneath the cursor.
  focus_follows_cursor: false

  # Whether to switch back and forth between previously focused workspace.
  toggle_workspace_on_refocus: false

  cursor_jump:
    # Automatically move cursor on focus change.
    enabled: true
    trigger: 'monitor_focus'

  # How windows should be hidden when switching workspaces ('cloak' is recommended for Windows).
  hide_method: 'cloak'

  # Only show windows from current workspace in Windows taskbar.
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true
  inner_gap: '8px'
  outer_gap:
    top: '42px'
    right: '8px'
    bottom: '8px'
    left: '8px'

window_effects:
  # Visual effects for the currently focused window (Catppuccin Mocha theme)
  focused_window:
    border:
      enabled: true
      color: '#4bfbe0' # Catppuccin Sapphire (High-contrast focused border)
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'rounded' # Windows 11 rounded corners

  # Visual effects for non-focused windows
  other_windows:
    border:
      enabled: true
      color: '#313244' # Catppuccin Surface0 (Dimmed unfocused border)
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'rounded'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: true
      shown_on_top: false

workspaces:
  - name: '1'
  - name: '2'
  - name: '3'
  - name: '4'
  - name: '5'
  - name: '6'
  - name: '7'
  - name: '8'
  - name: '9'

window_rules:
  - commands: ['ignore']
    match:
      # Zebar bar
      - window_process: { equals: 'zebar' }

      # Picture-in-picture windows for browsers
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }

      # Universal Progress & Operation dialogs (Explorer, 7-Zip, WinRAR, Installers, Updaters, etc.)
      - window_class: { regex: 'OperationStatusWindow|ProgressDialog|MsiDialogCloseClass' }
      - window_title: { regex: '(?i).*?%\s*(complete|done)?|Copying|Moving|Deleting|Replacing|Extracting|Compressing|Downloading|Installing|Uninstalling|Updating' }

      # Windows system utilities and 3rd party tools
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_title: { equals: 'Command Palette' }
        window_class: { equals: 'WinUIDesktopWin32WindowClass' }
      - window_process: { equals: 'PowerToys' }
        window_title: { regex: '.*? - Peek' }
      - window_process: { equals: 'Lively' }
        window_class: { regex: 'HwndWrapper' }
      - window_process: { equals: 'SnippingTool' }
      - window_process: { equals: 'ScreenClippingHost' }
      - window_process: { equals: 'Taskmgr' }
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }
      - window_process: { equals: 'Steam' }
        window_title: { regex: 'Friends List|Special Offers|Steam Guard' }

  # Dialogs / Settings / Alerts set to float (across all apps)
  - commands: ['set-floating --centered']
    match:
      # Universal standard Win32 dialogs (Open/Save file, properties, confirmations, alert boxes)
      - window_class: { equals: '#32770' }
      - window_class: { regex: 'TaskDialog|Credential Dialog Xaml Host' }
      # Windows system apps
      - window_process: { equals: 'SystemSettings' }
      - window_process: { equals: 'ApplicationFrameHost' }
        window_title: { regex: 'Settings|Calculator' }

binding_modes:
  # Resize mode (alt+r)
  - name: 'resize'
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['h', 'left']
      - commands: ['resize --width +2%']
        bindings: ['l', 'right']
      - commands: ['resize --height +2%']
        bindings: ['k', 'up']
      - commands: ['resize --height -2%']
        bindings: ['j', 'down']
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter', 'alt+r']

keybindings:
  # Focus navigation (hjkl + arrow keys)
  - commands: ['focus --direction left']
    bindings: ['alt+h', 'alt+left']
  - commands: ['focus --direction right']
    bindings: ['alt+l', 'alt+right']
  - commands: ['focus --direction up']
    bindings: ['alt+k', 'alt+up']
  - commands: ['focus --direction down']
    bindings: ['alt+j', 'alt+down']

  # Move window (shift + hjkl + arrow keys)
  - commands: ['move --direction left']
    bindings: ['alt+shift+h', 'alt+shift+left']
  - commands: ['move --direction right']
    bindings: ['alt+shift+l', 'alt+shift+right']
  - commands: ['move --direction up']
    bindings: ['alt+shift+k', 'alt+shift+up']
  - commands: ['move --direction down']
    bindings: ['alt+shift+j', 'alt+shift+down']

  # Quick resize
  - commands: ['resize --width -2%']
    bindings: ['alt+u']
  - commands: ['resize --width +2%']
    bindings: ['alt+p']
  - commands: ['resize --height +2%']
    bindings: ['alt+o']
  - commands: ['resize --height -2%']
    bindings: ['alt+i']

  # Enter resize mode (changed to alt+e to avoid clash with NVIDIA performance overlay)
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['alt+e']

  # Window state management
  - commands: ['toggle-tiling-direction']
    bindings: ['alt+v']
  - commands: ['wm-cycle-focus']
    bindings: ['alt+c']
  - commands: ['toggle-floating --centered']
    bindings: ['alt+shift+space']
  - commands: ['toggle-tiling']
    bindings: ['alt+t']
  - commands: ['toggle-fullscreen']
    bindings: ['alt+f']
  - commands: ['toggle-minimized']
    bindings: ['alt+m']
  - commands: ['close']
    bindings: ['alt+shift+q']
  - commands: ['shell-exec taskkill /f /fi "STATUS eq NOT RESPONDING"']
    bindings: ['alt+ctrl+q']

  # GlazeWM management
  - commands: ['wm-toggle-pause']
    bindings: ['alt+shift+p']
  - commands: ['wm-exit']
    bindings: ['alt+shift+e']
  - commands: ['wm-reload-config']
    bindings: ['alt+shift+r']
  - commands: ['wm-redraw']
    bindings: ['alt+shift+w']

  # Applications (Alt+Enter launches WezTerm)
  - commands: ['shell-exec wezterm-gui']
    bindings: ['alt+enter']

  # Workspace navigation
  - commands: ['focus --next-active-workspace']
    bindings: ['alt+s']
  - commands: ['focus --prev-active-workspace']
    bindings: ['alt+a']
  - commands: ['focus --recent-workspace']
    bindings: ['alt+d']

  - commands: ['focus --workspace 1']
    bindings: ['alt+1']
  - commands: ['focus --workspace 2']
    bindings: ['alt+2']
  - commands: ['focus --workspace 3']
    bindings: ['alt+3']
  - commands: ['focus --workspace 4']
    bindings: ['alt+4']
  - commands: ['focus --workspace 5']
    bindings: ['alt+5']
  - commands: ['focus --workspace 6']
    bindings: ['alt+6']
  - commands: ['focus --workspace 7']
    bindings: ['alt+7']
  - commands: ['focus --workspace 8']
    bindings: ['alt+8']
  - commands: ['focus --workspace 9']
    bindings: ['alt+9']

  # Move window to workspace
  - commands: ['move --workspace 1', 'focus --workspace 1']
    bindings: ['alt+shift+1']
  - commands: ['move --workspace 2', 'focus --workspace 2']
    bindings: ['alt+shift+2']
  - commands: ['move --workspace 3', 'focus --workspace 3']
    bindings: ['alt+shift+3']
  - commands: ['move --workspace 4', 'focus --workspace 4']
    bindings: ['alt+shift+4']
  - commands: ['move --workspace 5', 'focus --workspace 5']
    bindings: ['alt+shift+5']
  - commands: ['move --workspace 6', 'focus --workspace 6']
    bindings: ['alt+shift+6']
  - commands: ['move --workspace 7', 'focus --workspace 7']
    bindings: ['alt+shift+7']
  - commands: ['move --workspace 8', 'focus --workspace 8']
    bindings: ['alt+shift+8']
  - commands: ['move --workspace 9', 'focus --workspace 9']
    bindings: ['alt+shift+9']
