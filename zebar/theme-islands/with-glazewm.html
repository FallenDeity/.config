<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zebar Islands Theme</title>
    <link rel="stylesheet" type="text/css" href="./styles.css" id="main-theme-styles" />
    <link rel="stylesheet" type="text/css" href="./colors.css" id="theme-colors" />
    <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" data-type="module">
      import React, { useState, useEffect } from 'https://esm.sh/react@18?dev';
      import { createRoot } from 'https://esm.sh/react-dom@18/client?dev';
      import * as zebar from 'https://esm.sh/zebar@3.0';

      const providers = zebar.createProviderGroup({
        network: { type: 'network', refreshInterval: '2000' },
        glazewm: { type: 'glazewm' },
        cpu: { type: 'cpu', refreshInterval: '1000' },
        date: { type: 'date', formatting: 'EEE d MMM  HH:mm' },
        memory: { type: 'memory', refreshInterval: '2000' },
        media: { type: 'media' },
      });

      createRoot(document.getElementById('root')).render(<App />);

      function getWeatherIcon(desc) {
        const hour = new Date().getHours();
        const isNight = hour < 6 || hour >= 19;
        if (!desc) return isNight ? '🌙' : '⛅';
        const d = desc.toLowerCase();
        if (d.includes('sun') || d.includes('clear')) return isNight ? '🌙' : '☀️';
        if (d.includes('rain') || d.includes('drizzle') || d.includes('shower')) return '🌧️';
        if (d.includes('thunder') || d.includes('storm')) return '⛈️';
        if (d.includes('snow') || d.includes('ice') || d.includes('sleet')) return '❄️';
        if (d.includes('fog') || d.includes('mist')) return '🌫️';
        if (d.includes('cloud') || d.includes('overcast')) return isNight ? '☁️' : '⛅';
        return isNight ? '🌙' : '⛅';
      }

      function App() {
        const [output, setOutput] = useState(providers.outputMap);
        const [weather, setWeather] = useState(null);
        const [gpu, setGpu] = useState({ usage: 0, temp: 0 });
        const [variantIdx, setVariantIdx] = useState(0);

        useEffect(() => {
          async function initPalette() {
            try {
              const res = await fetch('./palette.json?t=' + Date.now());
              if (res.ok) {
                const pal = await res.json();
                if (pal?.current) {
                  document.documentElement.style.setProperty('--theme-accent-primary', pal.current.primary);
                  document.documentElement.style.setProperty('--theme-accent-secondary', pal.current.secondary);
                }
              }
            } catch (e) {}
          }
          initPalette();
        }, []);

        async function rerollTheme() {
          try {
            try {
              await zebar.shellExec('python', 'C:\\Users\\triya\\.glzr\\scripts\\sync-wallpaper-theme.py --reroll');
            } catch (cmdErr) {}

            try {
              const res = await fetch('./palette.json?t=' + Date.now());
              if (res.ok) {
                const pal = await res.json();
                if (pal?.current) {
                  document.documentElement.style.setProperty('--theme-accent-primary', pal.current.primary);
                  document.documentElement.style.setProperty('--theme-accent-secondary', pal.current.secondary);
                }
              }
            } catch (fetchErr) {}

            const colorLink = document.getElementById('theme-colors');
            if (colorLink) {
              colorLink.href = './colors.css?t=' + Date.now();
            }
          } catch (e) {}
        }

        useEffect(() => {
          providers.onOutput(() => setOutput({ ...providers.outputMap }));
        }, []);

        useEffect(() => {
          function fetchWeather() {
            fetch('https://wttr.in/?format=j1')
              .then(res => res.json())
              .then(data => {
                const cond = data?.current_condition?.[0];
                if (cond) {
                  const temp = cond.temp_C;
                  const desc = cond.weatherDesc?.[0]?.value || '';
                  setWeather(`${getWeatherIcon(desc)} ${temp}°C`);
                }
              })
              .catch(() => setWeather(null));
          }
          fetchWeather();
          const timer = setInterval(fetchWeather, 900000);
          return () => clearInterval(timer);
        }, []);

        useEffect(() => {
          let active = true;
          let isFetching = false;

          async function fetchGpu() {
            if (!active || isFetching || document.hidden) return;
            isFetching = true;
            try {
              const res = await zebar.shellExec('nvidia-smi', '--query-gpu=utilization.gpu,temperature.gpu --format=csv,noheader,nounits');
              if (res?.stdout && active) {
                const parts = res.stdout.trim().split(',');
                if (parts.length >= 2) {
                  setGpu({
                    usage: parseInt(parts[0].trim(), 10) || 0,
                    temp: parseInt(parts[1].trim(), 10) || 0,
                  });
                }
              }
            } catch (e) {
            } finally {
              isFetching = false;
            }
          }

          fetchGpu();
          const timer = setInterval(fetchGpu, 4000);

          const cleanup = () => {
            active = false;
            clearInterval(timer);
          };

          window.addEventListener('beforeunload', cleanup, { once: true });
          window.addEventListener('pagehide', cleanup, { once: true });

          return () => {
            cleanup();
            window.removeEventListener('beforeunload', cleanup);
            window.removeEventListener('pagehide', cleanup);
          };
        }, []);

        function formatSpeed(measure) {
          if (!measure) return '0K';
          const bytes = typeof measure.bytes === 'number' ? measure.bytes : 0;
          if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)}K`;
          if (bytes < 1024 * 1024 * 1024) return `${(bytes / (1024 * 1024)).toFixed(1)}M`;
          return `${(bytes / (1024 * 1024 * 1024)).toFixed(1)}G`;
        }

        const APP_ICONS = {
          // Web Browsers
          brave: 'nf-fa-compass',
          chrome: 'nf-fa-chrome',
          firefox: 'nf-fa-firefox',
          zen: 'nf-fa-firefox',
          'zen-browser': 'nf-fa-firefox',
          edge: 'nf-fa-edge',
          browser: 'nf-fa-globe',
          
          // Terminals & Shells
          terminal: 'nf-fa-terminal',
          powershell: 'nf-fa-terminal',
          pwsh: 'nf-fa-terminal',
          cmd: 'nf-fa-terminal',
          wezterm: 'nf-fa-terminal',
          alacritty: 'nf-fa-terminal',
          kitty: 'nf-fa-terminal',
          
          // Code & Development
          code: 'nf-cod-vscode',
          cursor: 'nf-cod-vscode',
          vscodium: 'nf-cod-vscode',
          neovim: 'nf-custom-neovim',
          nvim: 'nf-custom-neovim',
          vim: 'nf-dev-vim',
          git: 'nf-fa-git',
          github: 'nf-fa-github',
          antigravity: 'nf-fa-rocket',
          
          // Chat & Communication
          discord: 'nf-fa-discord',
          slack: 'nf-fa-slack',
          telegram: 'nf-fa-telegram',
          teams: 'nf-md-microsoft_teams',
          whatsapp: 'nf-fa-whatsapp',
          
          // Media & Streaming
          spotify: 'nf-fa-spotify',
          vlc: 'nf-fa-film',
          youtube: 'nf-fa-youtube',
          music: 'nf-fa-music',
          
          // Gaming
          steam: 'nf-fa-steam',
          game: 'nf-fa-gamepad',
          
          // Productivity & System
          obsidian: 'nf-fa-book',
          notion: 'nf-fa-sticky_note',
          explorer: 'nf-fa-folder',
          files: 'nf-fa-folder',
          settings: 'nf-fa-cog',
          taskmgr: 'nf-fa-tasks',
          btop: 'nf-fa-tasks',
        };

        function getProcessInfo(rawName) {
          if (!rawName) return { icon: 'nf-fa-desktop', name: 'Desktop' };
          const clean = rawName.replace(/\.exe$/i, '').trim();
          const lower = clean.toLowerCase();

          for (const [key, icon] of Object.entries(APP_ICONS)) {
            if (lower === key || lower.includes(key) || key.includes(lower)) {
              const formatted = clean.replace(/([a-z])([A-Z])/g, '$1 $2');
              const name = formatted.charAt(0).toUpperCase() + formatted.slice(1);
              return { icon, name };
            }
          }

          const formatted = clean.replace(/([a-z])([A-Z])/g, '$1 $2');
          const name = formatted.charAt(0).toUpperCase() + formatted.slice(1);
          return { icon: 'nf-md-application', name };
        }

        const currentMedia = output.media?.currentSession;
        const processInfo = getProcessInfo(output.glazewm?.focusedContainer?.processName);

        const isFullscreen = output.glazewm?.hasFullscreenWindow ||
          output.glazewm?.focusedContainer?.state?.type === 'fullscreen' ||
          output.glazewm?.focusedWorkspace?.children?.some(c => c.state?.type === 'fullscreen') ||
          output.glazewm?.currentWorkspaces?.some(ws => ws.children?.some(c => c.state?.type === 'fullscreen'));

        if (isFullscreen) {
          return <div className="app fullscreen-hidden"></div>;
        }

        return (
          <div className="app">
            {/* Left Island */}
            <div className="island left-island">
              <button
                className="theme-reroll-btn nf nf-fa-windows"
                title="Click to Reroll Wallpaper Theme Palette"
                onClick={rerollTheme}
              ></button>

              {output.glazewm && (
                <div className="workspaces">
                  {output.glazewm.currentWorkspaces.map(ws => (
                    <button
                      key={ws.name}
                      className={`workspace ${ws.hasFocus ? 'focused' : ''} ${ws.isDisplayed ? 'displayed' : ''}`}
                      onClick={() => output.glazewm.runCommand(`focus --workspace ${ws.name}`)}
                      title={`Workspace ${ws.displayName ?? ws.name}`}
                    />
                  ))}
                </div>
              )}

              {output.glazewm?.bindingModes?.map(mode => (
                <button
                  key={mode.name}
                  className="binding-mode"
                  onClick={() => output.glazewm.runCommand(`wm-disable-binding-mode --name ${mode.name}`)}
                >
                  {mode.displayName ?? mode.name}
                </button>
              ))}

              {output.glazewm?.isPaused && (
                <button
                  className="paused-button"
                  onClick={() => output.glazewm.runCommand('wm-toggle-pause')}
                >
                  PAUSED
                </button>
              )}

              {output.glazewm && (
                <button
                  className={`tiling-direction nf ${
                    output.glazewm.tilingDirection === 'horizontal'
                      ? 'nf-md-swap_horizontal'
                      : 'nf-md-swap_vertical'
                  }`}
                  title={`Tiling Direction: ${output.glazewm.tilingDirection}`}
                  onClick={() => output.glazewm.runCommand('toggle-tiling-direction')}
                ></button>
              )}
            </div>

            {/* Center Island with SVG S-curve Wings: Date + Weather + App Badge + Media */}
            <div className="center-island-container">
              <svg className="notch-wing left-wing" width="36" height="36" viewBox="0 0 36 36">
                <path d="M 0 0 C 16 0 16 36 36 36 L 36 0 Z" />
              </svg>

              <div className="center-island-body">
                {output.date && (
                  <div className="center-item clock-item">
                    <i className="nf nf-md-clock_outline clock-icon"></i>
                    <span className="clock-text">{output.date.formatted}</span>
                  </div>
                )}

                {weather && (
                  <>
                    <div className="center-divider"></div>
                    <div className="center-item weather-item">
                      <span className="weather-text">{weather}</span>
                    </div>
                  </>
                )}

                <div className="center-divider"></div>

                <div className="center-item app-item">
                  <i className={`nf ${processInfo.icon} app-icon`}></i>
                  <span className="app-text">{processInfo.name}</span>
                </div>

                {currentMedia && (
                  <>
                    <div className="center-divider"></div>
                    <div className="center-item media-card">
                      <i className="media-icon nf nf-md-music_note"></i>
                      <span
                        className="media-title"
                        title={`${currentMedia.artist ? currentMedia.artist + ' - ' : ''}${currentMedia.title}`}
                      >
                        {currentMedia.artist ? `${currentMedia.artist} - ` : ''}{currentMedia.title || 'Playing'}
                      </span>
                      <div className="media-buttons">
                        <button className="media-btn" title="Previous" onClick={() => output.media.previous()}>
                          <i className="nf nf-md-skip_previous"></i>
                        </button>
                        <button className="media-btn" title="Play/Pause" onClick={() => output.media.togglePlayPause()}>
                          <i className={`nf ${currentMedia.isPlaying ? 'nf-md-pause' : 'nf-md-play'}`}></i>
                        </button>
                        <button className="media-btn" title="Next" onClick={() => output.media.next()}>
                          <i className="nf nf-md-skip_next"></i>
                        </button>
                      </div>
                    </div>
                  </>
                )}
              </div>

              <svg className="notch-wing right-wing" width="36" height="36" viewBox="0 0 36 36">
                <path d="M 0 36 C 20 36 20 0 36 0 L 0 0 Z" />
              </svg>
            </div>

            {/* Right Island: Full Hardware Telemetry Deck */}
            <div className="island right-island">
              <div className="stat-group">
                {output.network && (
                  <div className="stat net" title="Network Speed">
                    <i className="nf nf-fa-wifi"></i>
                    <span className="net-down">↓{formatSpeed(output.network.traffic?.received)}</span>
                    <span className="net-up">↑{formatSpeed(output.network.traffic?.transmitted)}</span>
                  </div>
                )}

                {output.memory && (
                  <div className="stat ram" title="RAM Usage">
                    <i className="nf nf-fa-memory"></i>
                    <span>{Math.round(output.memory.usage)}%</span>
                  </div>
                )}

                {output.cpu && (
                  <div className="stat cpu" title="CPU Usage">
                    <i className="nf nf-oct-cpu"></i>
                    <span>{Math.round(output.cpu.usage)}%</span>
                  </div>
                )}

                {gpu && (
                  <div className="stat gpu" title={`GPU Usage: ${gpu.usage}% | Temp: ${gpu.temp}°C`}>
                    <i className="nf nf-md-expansion_card"></i>
                    <span>{gpu.usage}%</span>
                    <span className="gpu-temp">{gpu.temp}°C</span>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }
    </script>
  </body>
</html>
