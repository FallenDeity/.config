[updates]
auto_update = true
auto_update_interval_hours = 168

[display]
compact = false
use_pager = true

[style.command_name]
foreground = { rgb = { r = 203, g = 166, b = 247 } }
bold = true

[style.description]
foreground = { rgb = { r = 166, g = 173, b = 200 } }

[style.example_text]
foreground = { rgb = { r = 166, g = 227, b = 161 } }

[style.example_code]
foreground = { rgb = { r = 137, g = 180, b = 250 } }

[style.example_variable]
foreground = { rgb = { r = 250, g = 179, b = 135 } }
underline = true
